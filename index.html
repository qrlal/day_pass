<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>안전한 비밀번호 생성기</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding-top: 50px;
            background-color: #f5f5f5;
        }

        .box {
            border: 2px solid #ccc;
            padding: 20px;
            display: inline-block;
            background: white;
            border-radius: 8px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>오늘의 비밀번호</h2>
    <h1 id="password-display">------</h1>
    <button onclick="showMessage()">비밀번호 복사하기</button>
</div>

<script>
function showMessage() {
    document.getElementById('password-display').innerText = '응안알려줘니얼굴리도킹';
}
</script>

</body>
</html>
